apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: sid-devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend 
        image: sid0802/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4173

