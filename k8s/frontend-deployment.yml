apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: sid-devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend 
        image: sid0802/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4173
      resources:
        requests: #minimum resources required for the container to run
          memory: 64Mi
          cpu: 10m
        limits: #maximum resources the container can use
          memory: 128Mi
          cpu: 250m

