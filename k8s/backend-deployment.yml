apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-backend-deployment
  namespace: sid-devboard
  labels:
    app: devboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-backend
  template:
    metadata:
      labels:
        app: devboard-backend
    spec:
      containers:
      - name: devboard-backend 
        image: sid0802/devboard-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: devboard-secrets        # The ConfigMap this value comes from.
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devboard-secrets
              key: POSTGRES_PASSWORD


        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: devboard-secrets
              key: POSTGRES_DB

    
        - name:  POSTGRES_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"

        - name: PORT
          valueFrom:
            secretKeyRef:
              name: devboard-secrets
              key: BACKEND_PORT
    

